spring.application.name=ecom
## Server Configuration
server.port=8080
server.servlet.context-path=/api

## Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

## Logging Configuration
logging.level.root=INFO
logging.level.com.prl.ecom=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/ecom.log

## JWT Configuration
jwt.secret.key=MySecretKeyForJWTTokenGenerationAndValidationPleaseChangeThisInProduction123456789
jwt.expiration.access=900000
jwt.expiration.refresh=604800000
jwt.refresh.cookie.expiration=604800

## PayPal Configuration
paypal.mode=sandbox
paypal.client.id=YOUR_PAYPAL_CLIENT_ID
paypal.client.secret=YOUR_PAYPAL_CLIENT_SECRET
paypal.return.url=http://localhost:3000/checkout/success
paypal.cancel.url=http://localhost:3000/checkout/cancel

## Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

## Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.url-primary=true

## Application Info
app.name=E-Commerce API
app.version=1.0.0
app.description=Production-Ready E-Commerce REST API