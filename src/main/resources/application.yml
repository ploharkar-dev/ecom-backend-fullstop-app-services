spring:
  application:
    name: FUllSTOP - One Stop Solution For Your Needs
  
  server:
    port: 8080
    servlet:
      context-path: /api
  
  datasource:
    url: jdbc:mysql://localhost:3306/ecom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  mvc:
    throw-exception-if-no-handler-found: true
  
  web:
    resources:
      add-mappings: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.prl.ecom: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fullstop.log

jwt:
  secret:
    key: MySecureSecretKeyForJWTTokenGenerationAndValidationPleaseChangeThisInProduction123456789
  expiration:
    access: 900000
    refresh: 604800000
  refresh:
    cookie:
      expiration: 604800

paypal:
  mode: sandbox
  client:
    id: YOUR_PAYPAL_CLIENT_ID
    secret: YOUR_PAYPAL_CLIENT_SECRET
  return:
    url: http://localhost:3000/checkout/success
  cancel:
    url: http://localhost:3000/checkout/cancel

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    show-common-extensions: true
    url-primary: true
    operations-sorter: method

app:
  name: FUllSTOP - E-Commerce API
  version: 1.0.0
  description: Production-Ready E-Commerce REST API Platform
